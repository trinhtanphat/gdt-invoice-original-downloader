name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        shell: pwsh
        run: |
          node --check .\src\core.js
          node --check .\src\archive.js
          node --check .\src\content.js
      - name: Regression tests
        run: node .\tests\regression.mjs
      - name: ZIP archive tests
        run: node .\tests\archive.mjs
      - name: UTF-8 encoding tests
        run: node .\tests\encoding.mjs
